name: ops-center CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'ops-center/**'
      - '.github/workflows/ops-center-ci.yml'


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ops-center 后端测试
    runs-on: windows-latest
    # 10 分钟早已卡在临界：main 上最近 7 次有 3 次跑满被 cancelled
    # （02:35 / 02:04 / 06:30，均约 8-10 分钟），成功的那几次也在 8-10 分钟。
    # 本机 560 例约 4m40s，但 windows runner 慢约 2 倍，余量极小。
    # 抬到 25 分钟留出安全边际；同时已在 tests/test_change_password_api.py
    # 把 PBKDF2 迭代降到 1000（只影响该文件）压低增量成本。
    # ⚠️ 本文件属 CI 配置（改「守门者」），按规范需人工过目。
    timeout-minutes: 25
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          cd ops-center/backend
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: 运行测试
        run: |
          cd ops-center/backend
          python -m pytest tests/ -x --no-header -q

  # ⚠️ 2026-10-25 新增：运营中心**前端**的单元测试此前**在 CI 里一次都没跑过**。
  #
  # 事实（独立复评实测）：`ops-center/frontend` **不在 pnpm workspace 内**
  # （自带 package-lock.json、由 npm 管理）⇒ 上面那个 job 只跑后端 pytest
  # ⇒ 前端的 `vitest run`（含 `src/views/redemption-code-utils.test.js` 等 17 个文件 / 188 个用例）
  # **没有任何 workflow 跑** ⇒ 新增的前端用例在 CI 里是**空转**的。
  # 这正是本仓自己记过的失败形态（「新增文件没进白名单 ⇒ 一个都不跑」）。
  #
  # ⚠️ 另一个更隐蔽的形态（同一轮实测）：那个测试文件用
  # `new URL('./RedemptionCodes.vue', import.meta.url)` 读源码 ⇒ vitest 4 下
  # `import.meta.url` **不是 file:// 协议** ⇒ `readFileSync` 抛错 ⇒ **整份文件 0 个用例被执行**
  # ⇒ 本地跑出来是「16 passed / 1 failed（failed = 本文件加载失败）」，
  # 而 CI 里因为压根没跑 ⇒ 两种失败都看不见。
  # ⇒ 这个 job 的存在本身就是「别再空转」的保证。
  frontend-test:
    name: ops-center 前端测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ⚠️ 必须用 **npm ci**（不是 pnpm install）：ops-center/frontend 不在 pnpm workspace 内，
      # 自带 package-lock.json、由 npm 管理（与 dep-audit.yml 的同一口径）。
      - name: 安装依赖
        working-directory: ops-center/frontend
        run: npm ci

      - name: 运行测试
        working-directory: ops-center/frontend
        run: npm test
